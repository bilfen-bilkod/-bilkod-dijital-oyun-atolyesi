name: "BİLKOD - Takılı Pages Dağıtımını Onar"
on:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  issues: write

jobs:
  onar:
    if: >-
      github.event.issue.user.login == 'bilfen-bilkod' &&
      github.event.issue.title == '[BİLKOD PAGES ONARIM] 7a2c696262a447f8c71707188514cb0a234433a3'
    runs-on: ubuntu-latest
    steps:
      - name: Takılı GitHub Pages dağıtımını iptal et
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/pages/deployments/7a2c696262a447f8c71707188514cb0a234433a3/cancel"
      - name: Onarım durumunu kaydet
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ Takılı Pages dağıtımı iptal edildi. Yeni Pages dağıtımı yeniden denenebilir."
            gh issue close "$ISSUE_NUMBER" --reason completed
          else
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ Takılı Pages dağıtımı iptal edilemedi. Actions günlüğünü kontrol edin. GitHub destek ekibi gerekebilir."
          fi
